<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElipsusVenum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap" />
    <link rel="stylesheet" href="./src/ui/style.css" />
    <link rel="stylesheet" href="./src/ui/void.css" />
    <link rel="stylesheet" href="./src/ui/hud.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence id="boil-noise" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" />
        <feDisplacementMap in="SourceGraphic" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="boot">Loading...</div>
    <div id="stage-wrap"><div id="stage"></div></div>
    <div id="grain"></div>
    <div id="overlay-root"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
