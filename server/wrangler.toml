name = "elipsusvenum-relay"
main = "worker/index.ts"
compatibility_date = "2026-01-01"
send_metrics = false

# The Origin header the browser sends from the published game: no path, and the account name in lowercase.
# Any localhost port is allowed as well, for `wrangler dev`.
[vars]
ALLOWED_ORIGINS = "https://maplesugarstone.github.io"
ROOMS_PER_DAY = "150"

[observability]
enabled = true

# Only the relay's own log lines are kept. A log for every run would count each relayed message
# against the account's daily log limit.
[observability.logs]
invocation_logs = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# The free plan needs Durable Objects backed by SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]
